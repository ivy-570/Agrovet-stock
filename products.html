<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products – Agrovet System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --primary: #1b8f5a;
            --primary-dark: #146843;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #222;
            --muted: #777;
            --danger: #e74c3c;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }

        body { background: var(--bg); color: var(--text); }

        .layout { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            color: #e5e7eb;
            padding: 25px 18px;
        }

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #a5f3fc;
            font-weight: 600;
        }

        .nav-link {
            display: block;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav-link:hover { background: var(--sidebar-hover); }

        /* MAIN */
        .main { flex: 1; padding: 25px 30px; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .topbar-title { font-size: 24px; font-weight: 600; }

        .user-badge { font-size: 14px; color: var(--muted); }

        /* CARDS */
        .card {
            background: var(--card);
            border-radius: 10px;
            padding: 20px 22px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            margin-bottom: 22px;
        }

        .card-title { font-size: 18px; margin-bottom: 14px; font-weight: 600; }

        /* FORM */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--muted);
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .form-actions { margin-top: 14px; }

        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-secondary { background: #e5e7eb; color: #111827; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-sm { padding: 6px 10px; font-size: 13px; }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th { background: #f9fafb; font-weight: 600; }

        tr:hover { background: #f9fafb; }

        /* EDIT POPUP */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            width: 350px;
            border-radius: 8px;
        }

        .modal-header {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .modal-content label {
            font-size: 13px;
            color: var(--muted);
            display: block;
            margin-top: 8px;
        }

        .modal-content input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            margin-top: 3px;
        }

        .modal-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; display: flex; overflow-x: auto; }
            .nav-link { display: inline-block; margin-right: 8px; }
        }
    </style>
</head>

<body>
<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Agrovet</h2>

        <a href="#" class="nav-link">Dashboard</a>
        <a href="#" class="nav-link">Products</a>
        <a href="#" class="nav-link">Suppliers</a>
        <a href="#" class="nav-link">Customers</a>
        <a href="#" class="nav-link">Sales</a>
        <a href="#" class="nav-link">Purchases</a>
        <a href="#" class="nav-link">Stock History</a>
        <a href="#" class="nav-link">Users</a>
        <a href="#" class="nav-link">Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <div class="topbar">
            <div class="topbar-title">Products</div>
            <div class="user-badge">Logged in as Admin</div>
        </div>

        <!-- ADD PRODUCT FORM -->
        <div class="card">
            <div class="card-title">Add Product</div>

            <form id="productForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Product Name</label>
                        <input id="pname" type="text" placeholder="e.g. Animal Feed">
                    </div>

                    <div class="form-group">
                        <label>Buying Price</label>
                        <input id="buy" type="number" step="0.01" placeholder="e.g. 500">
                    </div>

                    <div class="form-group">
                        <label>Selling Price</label>
                        <input id="sell" type="number" step="0.01" placeholder="e.g. 650">
                    </div>

                    <div class="form-group">
                        <label>Quantity</label>
                        <input id="qty" type="number" placeholder="e.g. 20">
                    </div>

                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Save Product</button>
                </div>
            </form>
        </div>

        <!-- PRODUCT LIST -->
        <div class="card">
            <div class="card-title">Product List</div>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Buying</th>
                    <th>Selling</th>
                    <th>Qty</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="productTable">
                <!-- Rows will be added here -->
                </tbody>
            </table>
        </div>

    </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-header">Edit Product</div>

        <label>Name</label>
        <input id="editName" type="text">

        <label>Buying Price</label>
        <input id="editBuy" type="number">

        <label>Selling Price</label>
        <input id="editSell" type="number">

        <label>Quantity</label>
        <input id="editQty" type="number">

        <div class="modal-actions">
            <button class="btn btn-secondary" id="cancelEdit">Cancel</button>
            <button class="btn btn-primary" id="saveEdit">Save Changes</button>
        </div>
    </div>
</div>

<script>
    // Product data in memory (frontend only)
    let products = [
        { id: 1, name: "Animal Feed", buy: 500, sell: 650, qty: 20 },
        { id: 2, name: "Fertilizer", buy: 1200, sell: 1500, qty: 10 }
    ];
    let nextId = 3;

    const productTable = document.getElementById("productTable");
    const productForm = document.getElementById("productForm");

    const editModal = document.getElementById("editModal");
    const editName = document.getElementById("editName");
    const editBuy = document.getElementById("editBuy");
    const editSell = document.getElementById("editSell");
    const editQty = document.getElementById("editQty");
    const saveEditBtn = document.getElementById("saveEdit");
    const cancelEditBtn = document.getElementById("cancelEdit");

    let editingProductId = null;

    function renderTable() {
        productTable.innerHTML = "";
        products.forEach(p => {
            const tr = document.createElement("tr");
            tr.dataset.id = p.id;

            tr.innerHTML = `
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>${p.buy}</td>
                <td>${p.sell}</td>
                <td>${p.qty}</td>
                <td>
                    <button class="btn btn-sm btn-secondary btn-edit">Edit</button>
                    <button class="btn btn-sm btn-danger btn-delete">Delete</button>
                </td>
            `;
            productTable.appendChild(tr);
        });
    }

    // Initial render
    renderTable();

    // Add product
    productForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("pname").value.trim();
        const buy = document.getElementById("buy").value.trim();
        const sell = document.getElementById("sell").value.trim();
        const qty = document.getElementById("qty").value.trim();

        if (!name || !buy || !sell || !qty) {
            alert("Please fill all fields");
            return;
        }

        products.push({
            id: nextId++,
            name: name,
            buy: parseFloat(buy),
            sell: parseFloat(sell),
            qty: parseInt(qty)
        });

        productForm.reset();
        renderTable();
    });

    // Handle Edit/Delete buttons using event delegation
    productTable.addEventListener("click", function (e) {
        const target = e.target;
        const row = target.closest("tr");
        if (!row) return;
        const id = parseInt(row.dataset.id);

        if (target.classList.contains("btn-delete")) {
            // Delete
            if (confirm("Delete this product?")) {
                products = products.filter(p => p.id !== id);
                renderTable();
            }
        }

        if (target.classList.contains("btn-edit")) {
            // Edit
            const product = products.find(p => p.id === id);
            if (!product) return;

            editingProductId = id;
            editName.value = product.name;
            editBuy.value = product.buy;
            editSell.value = product.sell;
            editQty.value = product.qty;

            editModal.style.display = "flex";
        }
    });

    // Save edit
    saveEditBtn.addEventListener("click", function () {
        if (editingProductId === null) return;

        const name = editName.value.trim();
        const buy = editBuy.value.trim();
        const sell = editSell.value.trim();
        const qty = editQty.value.trim();

        if (!name || !buy || !sell || !qty) {
            alert("Please fill all fields");
            return;
        }

        const index = products.findIndex(p => p.id === editingProductId);
        if (index !== -1) {
            products[index].name = name;
            products[index].buy = parseFloat(buy);
            products[index].sell = parseFloat(sell);
            products[index].qty = parseInt(qty);
        }

        editModal.style.display = "none";
        editingProductId = null;
        renderTable();
    });

    // Cancel edit
    cancelEditBtn.addEventListener("click", function () {
        editModal.style.display = "none";
        editingProductId = null;
    });

    // Close modal when clicking outside
    window.addEventListener("click", function (e) {
        if (e.target === editModal) {
            editModal.style.display = "none";
            editingProductId = null;
        }
    });
</script>

</body>
</html>
