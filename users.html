<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users – Agrovet System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --primary: #1b8f5a;
            --primary-dark: #146843;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #222;
            --muted: #777;
            --danger: #e74c3c;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }

        body { background: var(--bg); color: var(--text); }

        .layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            color: #e5e7eb;
            padding: 25px 18px;
        }

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #a5f3fc;
            font-weight: 600;
        }

        .nav-link {
            display: block;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav-link:hover { background: var(--sidebar-hover); }

        .main { flex: 1; padding: 25px 30px; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .topbar-title { font-size: 24px; font-weight: 600; }

        .user-badge { font-size: 14px; color: var(--muted); }

        .card {
            background: var(--card);
            border-radius: 10px;
            padding: 20px 22px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            margin-bottom: 22px;
        }

        .card-title { font-size: 18px; margin-bottom: 14px; font-weight: 600; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--muted);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .form-actions { margin-top: 14px; }

        .btn {
            display: inline-block;
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-secondary { background: #e5e7eb; color: #111827; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-sm { padding: 6px 10px; font-size: 13px; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th { background: #f9fafb; font-weight: 600; }

        tr:hover { background: #f9fafb; }
    </style>
</head>

<body>
<div class="layout">

    <div class="sidebar">
        <h2>Agrovet</h2>

        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="products.html" class="nav-link">Products</a>
        <a href="suppliers.html" class="nav-link">Suppliers</a>
        <a href="customers.html" class="nav-link">Customers</a>
        <a href="sales.html" class="nav-link">Sales</a>
        <a href="purchases.html" class="nav-link">Purchases</a>
        <a href="stock.html" class="nav-link">Stock History</a>
        <a href="users.html" class="nav-link">Users</a>
        <a href="login.html" class="nav-link">Logout</a>
    </div>

    <div class="main">

        <div class="topbar">
            <div class="topbar-title">Users</div>
            <div class="user-badge">Logged in as <b>Ivy (Admin)</b></div>
        </div>

        <!-- ADD USER FORM -->
        <div class="card">
            <div class="card-title">Add User</div>

            <form id="userForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Name</label>
                        <input id="name" type="text" placeholder="e.g. Jane Doe">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input id="email" type="email" placeholder="e.g. jane@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>Role</label>
                        <select id="role">
                            <option value="admin">admin</option>
                            <option value="staff">staff</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input id="password" type="password" placeholder="Enter password">
                    </div>

                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Save User</button>
                </div>
            </form>
        </div>

        <!-- USER LIST -->
        <div class="card">
            <div class="card-title">User List</div>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="userTable"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
    // Load users or create default Ivy admin
    let users = JSON.parse(localStorage.getItem("agrovet_users")) || [];

    if (users.length === 0) {
        users.push({
            id: 1,
            name: "Ivy",
            email: "ivy@agrovet.com",
            role: "admin",
            password: "admin123",
            created: new Date().toISOString().split("T")[0]
        });
        localStorage.setItem("agrovet_users", JSON.stringify(users));
    }

    const userTable = document.getElementById("userTable");
    const userForm = document.getElementById("userForm");

    function renderUsers() {
        userTable.innerHTML = "";
        users.forEach(u => {
            const row = `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td>${u.created}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>
                    </td>
                </tr>
            `;
            userTable.innerHTML += row;
        });
    }

    renderUsers();

    userForm.addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const role = document.getElementById("role").value;
        const password = document.getElementById("password").value;

        if (!name || !email || !password) {
            alert("Fill all fields");
            return;
        }

        const id = users.length ? users[users.length - 1].id + 1 : 1;

        users.push({
            id,
            name,
            email,
            role,
            password,
            created: new Date().toISOString().split("T")[0]
        });

        localStorage.setItem("agrovet_users", JSON.stringify(users));
        userForm.reset();
        renderUsers();
    });

    function deleteUser(id) {
        if (!confirm("Delete this user")) return;

        users = users.filter(u => u.id !== id);
        localStorage.setItem("agrovet_users", JSON.stringify(users));
        renderUsers();
    }
</script>

</body>
</html>
