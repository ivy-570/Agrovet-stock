<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Agrovet System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: linear-gradient(135deg, #1b8f5a, #146843);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
        }

        .login-box {
            width: 380px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #1b8f5a;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            text-align: center;
            margin-bottom: 20px;
            color: #475569;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1b8f5a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #146843;
        }

        .register-link {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .register-link a {
            color: #1b8f5a;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Agrovet System</h2>
    <p>Login to continue</p>

    <form>
        <input type="email" placeholder="Email Address">
        <input type="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        Don't have an account? <a href="register.html">Register</a>
    </div>
</div>

</body>
</html>
