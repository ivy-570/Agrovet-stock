<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register – Agrovet System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: linear-gradient(135deg, #1b8f5a, #146843);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
        }

        .login-box {
            width: 380px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #1b8f5a;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            text-align: center;
            margin-bottom: 20px;
            color: #475569;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1b8f5a;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #146843;
        }

        .register-link {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .register-link a {
            color: #1b8f5a;
            text-decoration: none;
            font-weight: 600;
        }

        .error, .success {
            text-align: center;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .error { color: #e11d48; }
        .success { color: #16a34a; }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Agrovet System</h2>
    <p>Create an account</p>

    <div id="message"></div>

    <form id="registerForm">
        <input id="name" type="text" placeholder="Full Name" required>
        <input id="email" type="email" placeholder="Email Address" required>
        <input id="password" type="password" placeholder="Password" required>

        <button type="submit">Register</button>
    </form>

    <div class="register-link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script>
    const registerForm = document.getElementById("registerForm");
    const messageDiv = document.getElementById("message");

    registerForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;

        if (!name || !email || !password) {
            showMessage("Please fill all fields", "error");
            return;
        }

        // Get existing users from localStorage
        let users = JSON.parse(localStorage.getItem("agrovet_users") || "[]");

        // Check if email already exists
        if (users.some(u => u.email === email)) {
            showMessage("Email already registered. Please login.", "error");
            return;
        }

        // Add new user
        users.push({ name, email, password });
        localStorage.setItem("agrovet_users", JSON.stringify(users));

        showMessage("Registration successful! Redirecting to login...", "success");

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);
    });

    function showMessage(text, type) {
        messageDiv.className = type;
        messageDiv.textContent = text;
    }
</script>

</body>
</html>
